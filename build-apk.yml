name: Build Cadence
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native projects
        run: |
          flutter create --org com.tanimsarker --project-name cadence --platforms=android,ios app
          rm -rf app/lib app/test
          mkdir -p app/lib
          cp "$(find . -path ./app -prune -o -name main.dart -print | head -n1)" app/lib/main.dart
          cp "$(find . -path ./app -prune -o -name library.dart -print | head -n1)" app/lib/library.dart
          cp "$(find . -path ./app -prune -o -name pubspec.yaml -print | head -n1)" app/pubspec.yaml
          mkdir -p app/assets
          cp "$(find . -path ./app -prune -o -name cadence_icon.png -print | head -n1)" app/assets/icon.png
          python3 "$(find . -path ./app -prune -o -name patch_native.py -print | head -n1)" app
      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release || true
      - name: Locate APK
        run: |
          mkdir -p out
          find . -name "*.apk" -path "*release*" -not -path "./out/*" -exec cp {} out/Cadence.apk \; -quit
          ls -la out
          test -f out/Cadence.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-android-apk
          path: out/Cadence.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native projects
        run: |
          flutter create --org com.tanimsarker --project-name cadence --platforms=android,ios app
          rm -rf app/lib app/test
          mkdir -p app/lib
          cp "$(find . -path ./app -prune -o -name main.dart -print | head -n1)" app/lib/main.dart
          cp "$(find . -path ./app -prune -o -name library.dart -print | head -n1)" app/lib/library.dart
          cp "$(find . -path ./app -prune -o -name pubspec.yaml -print | head -n1)" app/pubspec.yaml
          mkdir -p app/assets
          cp "$(find . -path ./app -prune -o -name cadence_icon.png -print | head -n1)" app/assets/icon.png
          python3 "$(find . -path ./app -prune -o -name patch_native.py -print | head -n1)" app
      - name: Build iOS (unsigned)
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ios --config-only --release --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -derivedDataPath ../build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          cd ..
          mkdir Payload
          cp -r build/dd/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qr Cadence-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-ios-unsigned-ipa
          path: app/Cadence-unsigned.ipa
