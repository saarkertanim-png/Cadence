name: Build Cadence APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files
        run: |
          f=$(find . -path ./node_modules -prune -o -type f -iname '*index.html' -print | head -n1)
          echo "found: [$f]"
          cp "$f" /tmp/idx.html
          mkdir -p www
          cp /tmp/idx.html www/index.html
          ls -la www
      - run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
